name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pipx install ruff
      - name: ruff
        run: ruff check src tests
      - name: shellcheck
        run: |
          shellcheck install.sh iso/build.sh iso/config/includes.chroot/usr/local/bin/winbootfix-menu \
            iso/config/hooks/normal/*.hook.* tests/loop/make_image.sh tests/iso/boot_smoke.sh \
            packaging/build-deb.sh
          shellcheck -x tests/vm/*.sh tests/vm/scenarios/*.sh

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-hivex python3-pytest
      - name: Unit tests
        run: /usr/bin/python3 -m pytest -q tests/unit

  loop:
    # Real GPT disk images with FAT32 and NTFS (ntfs-3g) through loop devices.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-hivex python3-pytest gdisk dosfstools ntfs-3g efibootmgr fusefat
      - name: Integration tests (root)
        run: sudo /usr/bin/python3 -m pytest -q tests/loop

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          $r = Invoke-Pester tests/windows -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { exit 1 }

  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential dpkg-dev debhelper
      - run: packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  iso:
    runs-on: ubuntu-24.04
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build the ISO (Docker, Debian snapshot)
        run: |
          docker build -t winbootfix-iso iso
          docker run --rm --privileged -v "$PWD:/src" winbootfix-iso
      - name: Inspect the ISO
        run: |
          sudo apt-get install -y qemu-system-x86 ovmf socat xorriso
          ls -lh dist
          xorriso -indev dist/winbootfix-*-amd64.iso -find / -type f -name "*.efi" -o -name "*.cfg" -o -name "vmlinuz*" -o -name "*.squashfs" 2>/dev/null
          xorriso -osirrox on -indev dist/winbootfix-*-amd64.iso -extract /boot/grub/grub.cfg /tmp/grub.cfg >/dev/null 2>&1 && head -60 /tmp/grub.cfg
      - name: Boot test, live system (direct kernel boot)
        run: |
          sudo chmod 666 /dev/kvm || true
          KERNEL_BOOT=1 TIMEOUT=600 FAIL_SHOT=dist/fail-kernel.png tests/iso/boot_smoke.sh dist/winbootfix-*-amd64.iso
      - name: Boot test, full chain (OVMF Secure Boot, shim, GRUB)
        run: TIMEOUT=900 FAIL_SHOT=dist/fail-secureboot.png tests/iso/boot_smoke.sh dist/winbootfix-*-amd64.iso dist/menu.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso
          if-no-files-found: ignore
          path: |
            dist/*.iso
            dist/*.sha256
            dist/*.packages
            dist/*.png
