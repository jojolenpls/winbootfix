[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "winbootfix"
dynamic = ["version"]
description = "Repair a missing Windows Boot Manager entry and an unhealthy Windows (graphics driver, DLLs, system files) from Linux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "winbootfix contributors"}]
keywords = ["windows", "uefi", "bcd", "efibootmgr", "repair", "boot", "rescue"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Recovery Tools",
]

[project.urls]
Homepage = "https://github.com/jojolenpls/winbootfix"
Issues = "https://github.com/jojolenpls/winbootfix/issues"

[project.scripts]
winbootfix = "winbootfix.cli:main"

[tool.setuptools.dynamic]
version = {attr = "winbootfix.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
winbootfix = ["data/*.json", "data/schemas/*.json"]

[tool.setuptools.data-files]
"share/winbootfix/locales" = ["locales/en.json", "locales/fr.json"]
"share/winbootfix/windows" = ["windows/winbootfix-post.ps1", "windows/winbootfix-post.cmd"]
"share/winbootfix/windows/winpe" = ["windows/winpe/build-winpe.ps1", "windows/winpe/startnet.cmd", "windows/winpe/winpe-repair.ps1"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B904", "UP007", "UP006", "UP035"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/loop"]
